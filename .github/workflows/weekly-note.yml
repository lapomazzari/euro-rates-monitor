# Weekly refresh, every Saturday. Needs no repository secrets: ECB, the Fed Board and
# the public FRED CSV endpoint are keyless, and the commit uses the automatic
# GITHUB_TOKEN.
#
# What it commits: refreshed data/processed/, figures/ and the README headline.
# What it does not commit: any note. Notes in notes/ are written by hand. The run
# writes this week's scaffold (figures, dates, chart, placeholders) outside notes/ and
# attaches it to the run as a downloadable artifact, as a starting point.
name: weekly-note

on:
  schedule:
    - cron: "0 6 * * 6"   # Saturday 06:00 UTC, after Friday's ECB curve is published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Test
        run: pytest -q
      - name: Fetch, build, charts, README headline
        run: |
          erm fetch
          erm build
          erm report
          erm readme
      - name: Check committed notes against their figures
        run: erm check-note notes/
      - name: Write this week's scaffold (not committed)
        run: erm note --out scaffold
      - uses: actions/upload-artifact@v4
        with:
          name: note-scaffold
          path: scaffold/
          retention-days: 30
      - name: Commit data, figures and headline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed figures README.md
          git diff --cached --quiet || git commit -m "Update weekly data and figures"
          git push
