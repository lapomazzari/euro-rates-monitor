# Lint, test and check every committed note on each push and pull request. Offline:
# everything runs on the committed sample and processed data, so no network access or
# secrets are needed. A note with a number or date not in its figures file fails here.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q
      - name: Check notes
        run: erm check-note notes/
